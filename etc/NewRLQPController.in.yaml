# log_impact_vel: rising-edge detection on the ankle F/T sensors' Fz
# (RightFootForceSensor/LeftFootForceSensor -- same names on mc_hrp5_p,
# attached to Rleg_Link5/Lleg_Link5, confirmed in mc_hrp5_p.cpp). On
# touchdown, logs the ankle body's world-frame linear
# velocity (NewRLQPController_leftFootImpactVel / _rightFootImpactVel) --
# holds the last value between impacts, read it where
# NewRLQPController_{left,right}FootContact steps 0 -> 1. Raw Fz is logged
# unconditionally as NewRLQPController_{left,right}FootForceZ, needed to
# pick impact_force_threshold in the first place. This key existed in the
# yaml since the project's first commit but had no implementation behind it
# until 2026-08-20.
log_impact_vel: true
# impact_force_threshold: N on Fz, rising edge = touchdown.
impact_force_threshold: 30.0
# impact_force_hysteresis_ratio: falling-edge threshold = ratio * impact_force_threshold,
# so sensor noise straddling the threshold mid-stance does not retrigger the impact.
impact_force_hysteresis_ratio: 0.5
# verbose_log: also log what a robot run does not need -- constants (gains, q0,
# action scale), the policy observation (NewRLQPController_RL_currentObservation,
# Tracking_obs), copies of what mc_rtc logs anyway (currents and torques, the
# joint states in reference order: Tracking_qReal, Tracking_alphaReal,
# Tracking_tauReal, Tracking_qControl, ...), and the self-collision distances,
# computed every tick for the log. About half of the per-tick log volume.
# Always logged: the targets (NewRLQPController_RL_q, NewRLQPController_ctrl_q,
# Tracking_target), the actions, the modes, the armed and guard state, and the
# tracking time, observed base and reference anchor. Turn it on for simulation
# analyses that read the verbose entries.
verbose_log: false
# Simulation only: a file in mc_mujoco's PD gains format (one "kp kd" row per
# ref_joint_order joint) that the controller gives mc_mujoco's joint PD on the
# first tick after each reset, e.g. the real robot's servo gains, kept outside
# the repository. Empty: mc_mujoco's own gains. Ignored on the robot (no
# simulator PD to set).
sim_servo_gains: ""
