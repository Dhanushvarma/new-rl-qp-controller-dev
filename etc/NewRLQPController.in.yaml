---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# This block is the ONLY thing that actually puts a self-collision constraint
# in the solver: MCController.cpp:322-331 builds a CollisionsConstraint from
# the "collisions" key and calls solver().addConstraintSet() on it. The
# selfCollisionConstraint member tweaked in NewRLQPController's constructor
# (thigh iDist correction, setCollisionsDampers) is a SEPARATE object that is
# never added to the solver, so editing it there changes nothing -- and
# commenting this block out is what actually disables the protection.
#
# Briefly disabled on 2026-08-07 to test whether self-collision explained the
# QP-vs-bypass gap. It did not; restored.
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences
    # WAIKO estimator: IMU + legged odometry (no QP contacts needed).
    # imuSensor must be the real IMU (Accelerometer, gyro+accelero at the imu
    # site) -- FloatingBase is the mc_mujoco ground-truth pose sensor.
    # leggedOdometry and filterGains: the lab controller's settings
    # (hrp5p_rl_qp_controller), under which the tracking policy's estimated-base
    # runs were checked. Without an odometry type MCWaiko uses none and the
    # estimate never updates its yaw nor its horizontal position (measured in
    # mc_mujoco: 29.7 deg of yaw error within 2 s of tracking): harmless for the
    # velocity policies, which do not observe them, wrong for the tracking
    # observation (anchor pose against the reference). These apply to every
    # slot; they override any installed default MCWaiko.yaml.
    - type: MCWaiko
      update: true
      gui: true
      imuSensor: Accelerometer
      leggedOdometry:
        odometryType: 6D
      filterGains:
        initAlpha: 4
        initRho: 2
        initBeta: 4
        initGamma: 1
        initMu: 1
        finalAlpha: 4
        finalRho: 1
        finalBeta: 4
        finalGamma: 1
        finalMu: 1
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # Ground-truth fallback (mc_mujoco perfect pose), for comparison:
    # - type: BodySensor
    #   update: true
    #   gui: true
    #   bodySensor: FloatingBase

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Toutes les politiques sont EMBARQUEES : les fichiers vivent dans policy/ et
# CMake installe le repertoire entier vers @RL_POLICY_INSTALL_PREFIX@. Aucun
# chemin absolu vers le home de qui que ce soit, donc un clone + build sur le PC
# du robot a les politiques sans avoir mjlab-hrp5p nulle part.
#
# Cette branche `hrp5p` ne porte que HRP5P : les entrees RHPS1 (trois
# policies, x_shared_plant, joint_torque_scale) sont parties le jour de la
# creation de cette branche, meme geste que RHP7 retirant RHPS1 sur `rhp7` le
# 2026-09-01 -- les deux robots ne peuvent de toute facon pas coexister a
# l'execution (MainRobot est fige au demarrage de mc_rtc, et les maps
# kp/kd/q0/effort_limit sont lues en .at() contre le refJointOrder du robot
# charge, donc un index de l'autre robot leve std::out_of_range dans
# initializeRobot()). Recuperables sur `real-robot-safe`/l'historique git.
#
# ARMER DEPUIS LA GUI, une main sur l'arret. Aucune de ces policies n'a encore
# tourne, ni en simulation ni sur le robot.
#
# Every entry is loaded when the controller starts, so a GUI policy switch
# reads nothing from disk in the control loop. The default_policy_index one
# failing to load stops the start; another one is logged and switching to it
# is refused.
policy_path: [
  # hrp5_mirror (run mjlab exp1/2026-10-05_11-39-28, symetrie gauche/droite) :
  # meme observation (obs_format 8,
  # historique 20) et meme q0. Entrainee avec le filtre PostureTask (K=1600,
  # Kv auto, dt 5 ms), le servo bas niveau iob du HRP5P (iob_servo, pas de
  # reference de vitesse, interpolation sur 2 pas de 1 ms) et un modele de
  # frottement articulaire. NOUVEAUX gains PD (HRP5P_PD_GAINS) et nouvelle
  # action_scale, voir plus bas ; physique a 1 ms, decimation 10.
  # index 0 : push7 (run 2026-10-15_18-31-35), index 1 : angmom (run
  # 2026-10-18_15-15-18). Meme famille (filtre PostureTask sans refVel,
  # echelle x11, memes actionneurs et plages de commande), d'ou un seul bloc
  # de reglages partage plus bas. Bascule depuis la GUI, policy desarmee.
  "@RL_POLICY_INSTALL_PREFIX@/push7.onnx",
  "@RL_POLICY_INSTALL_PREFIX@/angmom.onnx",
  # index 2 : push11 (run 2026-10-21_12-15-08), meme famille et meme
  # action_scale que push7 (metadonnees de l'onnx et bloc actions du env.yaml
  # identiques), meme chaine iob / PostureTask a l'entrainement.
  "@RL_POLICY_INSTALL_PREFIX@/push11.onnx",
  # index 3: P8, whole-body motion tracking (see its slot below). P6 final's
  # file stays in tracking/P6_final/ (the tracking tests' golden policy).
  "@RL_POLICY_INSTALL_PREFIX@/tracking/P8_17998/policy.onnx",
]
# Exige MainRobot: HRP5P dans mc_rtc.yaml (module mc_hrp5_p).
# 3 = the motion tracking slot (P8): select it from the GUI while
# disarmed, or set it here.
default_policy_index: 0

# Replay en boucle fermee (SIMULATION SEULEMENT, refuse sous RobotHardware) :
# rejoue les velCmd d'un run reel, chronometres depuis l'armement, a la place
# du joystick. Commenter pour revenir au joystick.
#vel_cmd_replay: /home/leroyhi/exp_hrp5p/07_10/reel_velcmd.json

policies:
  # index 0 : HRP5P, velocity-action (push7 ; index 1 angmom = alias en fin
  # de liste) -- premiere integration,
  # jamais testee (ni sim ni robot). Exige MainRobot: HRP5P (module
  # mc_hrp5_p, construit dans le superbuild avec WITH_HRP5 ON) sous peine de
  # std::out_of_range dans initializeRobot() (les maps kp/kd/q0/effort_limit
  # ci-dessous sont lues avec .at() sur le refJointOrder du robot charge --
  # les 53 joints, pas seulement les 33 pilotes par la policy, cf. le
  # commentaire sur effort_limit plus bas).
  #
  # 33 joints actionnes par ref_joint_order (RCY..LWRP), ordre confirme
  # directement dans les metadonnees embarquees de policy/hrp5_collisions.onnx
  # (joint_names / action_scale) -- PAS celui de hrp5_constants.py
  # (HRP5P_ACTUATORS a un ordre bras-gauche incoherent avec l'onnx reel,
  # WRY avant EP au lieu de EP avant WRY).
  #
  # obs_format: 8 -- l'onnx attend une entree [1, 2220] = 20 * (3+3+3+33+33+33+3),
  # donc un historique profondeur 20 sur les sept termes (base_lin_vel,
  # base_ang_vel, projected_gravity, joint_pos, joint_vel, actions, command),
  # confirme par onnxruntime (InferenceSession(...).get_inputs()) ET par
  # mjlab/tasks/velocity/velocity_env_cfg_hrp5.py:93 (history_length=20).
  # Chaque frame correspond a un pas de policy (policyStepSize, PAS timeStep) :
  # utils.cpp ne pousse l'historique que dans le bloc `if(newInference)`
  # (une fois par policy_step_size), qui tombe a 100 Hz ici -- exactement le
  # rythme d'un pas d'env mjlab (decimation 4 * timestep 0.0025 = 0.01s).
  # Implemente dans utils.cpp `case 8:` (fallthrough vers le corps generique
  # partage avec l'ancien `case 2:` RHPS1) et V3_DEEP_HISTORY_SIZE a 20 dans
  # NewRLQPController.h -- sans consequence sur RHPS1 puisque cette branche ne
  # le porte plus. NE PAS ARMER avant un premier test simulation.
  - &hrp5p_push_family
    use_QP: true
    obs_format: 8
    velocity_action: true
    # vel0qp : entrainee avec une reference de vitesse NULLE dans le PD bas
    # niveau (tau = kp (q* - q) - kd qdot) : alpha out a 0 vers la simu / le
    # robot (comme qp_zero_vel_out).
    zero_vel_ref: true
    # refVel de la PostureTask (vitesse desiree dans le QP). false = refVel a 0
    # et integrale libre de la vitesse comme a l'entrainement.
    posture_ref_vel: false
    # Integration de q_rl sous le QP : true = re-seede chaque pas sur la sortie du
    # QP, sans refVel -- exactement le posture_task_filter de l'entrainement
    # (posture_task_vel_feedforward: false, seed_lag 0), avec l'echelle x11 de ce
    # run (metadonnees de l'onnx). En integrale libre + echelle /11, angmom oscille a ~5.4 Hz
    # en roulis sous QP (sim du 2026-10-19), pas avec ce reglage.
    qp_reseed_integral: true
    use_torque_task: false
    qp_accel_task: false
    joint_armature: 1.0
    policy_step_size: 0.01     # 100 Hz (10 ms) -- decimation 10 * timestep 0.001,
                                # mjlab/tasks/velocity/velocity_env_cfg_hrp5.py
    physics_step_size: 0.001   # pas physique de l'entrainement (1 ms) ;
                               # sert seulement a un avertissement dans configRL()
    pd_gains_ratio: 1.0
    posture_stiffness: 1600
    # Plages de commande de push6 / push7 (meme run mjlab 2026-10-15_18-31-35,
    # push7 = dernier export : lin_vel_x +-0.6, lin_vel_y +-0.4, ang_vel_z +-0.8).
    max_vel_x: 0.6
    max_vel_y: 0.4
    max_yaw: 0.8
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5
    torque_feasibility_ratio: 1.0
    vel_target_filter_alpha: 0.8

    # Delai d'actionneur FIXE pour ce deploiement sim-in-sim (rl_controller +
    # mc_mujoco), demande explicitement plutot que de laisser le delai
    # randomise de l'entrainement (mjlab IdealPdActuatorCfg
    # actuation_delay_min_lag/actuation_delay_max_lag, pd_actuator.py : un
    # DelayBuffer resample par env, garde a actuation_delay_hold_prob du
    # temps). Ici : un seul deploiement, donc un seul delai constant en ms,
    # converti en pas de controleur (timeStep, PAS policy_step_size ni
    # physics_step_size) dans NewRLQPController::configRL(). 40ms / 0.005s
    # (Timestep de mc_rtc.yaml) = 8 pas. Applique entre q_rl/qdTarget_ et la
    # cible de la PostureTask (delayedQRl_()/delayedQdTarget_() dans
    # NewRLQPController.cpp), au meme endroit que le DelayBuffer de mjlab
    # (apres l'anti-windup, juste avant l'erreur de PD).
    #
    # L'entrainement randomise ce delai entre actuation_delay_min_lag=14 et
    # actuation_delay_max_lag=22 (hrp5_constants.py), soit 35-55 ms a 400 Hz.
    # Un 40 ms fixe avait donc ete choisi ici, au milieu de cette plage.
    #
    # Remis a 0 : mesure par correlation croisee sur le log du 2026-09-24
    # 13:06 (115 s de marche, regime etabli), la sortie du QP suit q_rl avec
    # 5-10 ms de retard seulement, pas les 40 configures -- le QP en annule
    # ~30. Verifie que ce n'etait ni le binaire (le code du retard y est), ni
    # le YAML installe, ni le clamp anti-windup (il ne borne que 4.5% du
    # temps), ni setPostureRefAccel (posture_passthrough absent donc false),
    # ni le filtre de la PostureTask (-0.7 deg de dephasage a 1.2 Hz). Cause
    # non identifiee. A 0 vs 120 ms on saura si l'estimateur est biaise ou
    # s'il y a un vrai bug entre la PostureTask et la sortie du QP.
    actuation_delay_ms: 0.0

    # Biais de pitch sur l'orientation IMU vue par la politique (degres,
    # positif = vers l'avant) : avec le robot droit, projected_gravity vaut
    # (sin, 0, -cos) de cet angle. N'affecte que l'observation, pas
    # l'estimateur ni le QP.
    imu_pitch_bias_deg: 0.0

    # effort_limit reels des HRP5P_ACTUATOR_* d'entrainement
    # (mjlab/asset_zoo/robots/hrp5/hrp5_constants.py), utilises pour deriver
    # action_scale par la meme formule que RHP7 (e / (3*(kp*0.01+kd))) --
    # recoupe chiffre par chiffre avec policy/hrp5_collisions.onnx (metadata action_scale).
    effort_limit: &hrp5p_effort_limit
      RCY:  200
      RCR:  500
      RCP:  500
      RKP:  1200
      RAP:  250
      RAR:  200
      LCY:  200
      LCR:  500
      LCP:  500
      LKP:  1200
      LAP:  250
      LAR:  200
      WP:   900
      WR:   900
      WY:   250
      HY:   45
      HP:   45
      RSC:  200
      RSP:  400
      RSR:  350
      RSY:  200
      REP:  400
      RWRY: 300
      RWRR: 300
      RWRP: 120
      LSC:  200
      LSP:  400
      LSR:  350
      LSY:  200
      LEP:  400
      LWRY: 300
      LWRR: 300
      LWRP: 120
      # Joints hors ref_joint_order (mc_hrp5_p::refJointOrder() en a 53, la
      # policy n'en pilote que 33) -- necessaires quand meme, kp/kd/q0/
      # effort_limit sont lus avec .at() sur TOUS les joints du robot charge,
      # pas seulement ceux de ref_joint_order (NewRLQPController.cpp:373-380).
      # Non entraines : jamais dans currentAction, donc q_rl y reste fige a
      # q0 en permanence (personne ne l'ecrit), tenu par la PostureTask a
      # kp/kd ci-dessous -- une pose statique, pas une commande RL. effort_limit
      # = ctrlrange * gear du <motor> MJCF (HRP5Pmain.xml), pas une valeur
      # d'entrainement (ces joints n'en ont pas) : RHDY/LHDY 0.113*300=33.9,
      # doigts 0.062*623.27=38.64.
      RHDY: 33.9
      LHDY: 33.9
      RTMP:  38.64
      RTPIP: 38.64
      RTDIP: 38.64
      RIMP:  38.64
      RIPIP: 38.64
      RIDIP: 38.64
      RMMP:  38.64
      RMPIP: 38.64
      RMDIP: 38.64
      LTMP:  38.64
      LTPIP: 38.64
      LTDIP: 38.64
      LIMP:  38.64
      LIPIP: 38.64
      LIDIP: 38.64
      LMMP:  38.64
      LMPIP: 38.64
      LMDIP: 38.64

    # Valeurs conservatrices choisies a la main (pas mesurees), memes
    # proportions que le bloc RHP7 (jambes/taille plus permissives que
    # bras/tete) -- a resserrer/relacher apres un premier essai.
    vel_target_limit_per_joint: &hrp5p_vel_target_limit_per_joint
      RCY:  8
      RCR:  8
      RCP:  8
      RKP:  10
      RAP:  10
      RAR:  10
      LCY:  8
      LCR:  8
      LCP:  8
      LKP:  10
      LAP:  10
      LAR:  10
      WP:   8
      WR:   8
      WY:   8
      HY:   4
      HP:   4
      RSC:  6
      RSP:  6
      RSR:  6
      RSY:  6
      REP:  6
      RWRY: 6
      RWRR: 6
      RWRP: 6
      LSC:  6
      LSP:  6
      LSR:  6
      LSY:  6
      LEP:  6
      LWRY: 6
      LWRR: 6
      LWRP: 6
      # Hors ref_joint_order (cf. commentaire sur effort_limit ci-dessus) --
      # optionnel en pratique (updateIfExists, pas de .at()), mais explicite
      # ici pour rester coherent avec le reste du fichier.
      RHDY: 4
      LHDY: 4
      RTMP:  4
      RTPIP: 4
      RTDIP: 4
      RIMP:  4
      RIPIP: 4
      RIDIP: 4
      RMMP:  4
      RMPIP: 4
      RMDIP: 4
      LTMP:  4
      LTPIP: 4
      LTDIP: 4
      LIMP:  4
      LIPIP: 4
      LIDIP: 4
      LMMP:  4
      LMPIP: 4
      LMDIP: 4

    # action_scale et q0 : PLUS ICI, lus dans les metadonnees de l'onnx a
    # l'initialisation (applyOnnxMetadata() : action_scale sur ref_joint_order,
    # q0 = default_joint_pos sur les 35 joints actionnes, observation_names et
    # ref_joint_order verifies). Arrondis a 3 decimales par l'exporteur
    # (<= 5e-4 rad sur q0, < 0.1 % sur action_scale). use_onnx_metadata: false
    # pour revenir a des blocs action_scale / q0 ecrits ici a la main.
    # angmom (comme vel0qp/push*) porte l'echelle x11 de son entrainement : a
    # n'utiliser qu'avec qp_reseed_integral: true (le robot explose sinon).
    # kp/kd restent ci-dessous : joint_stiffness / joint_damping de l'onnx sont
    # des valeurs factices de l'exporteur (1.000 / -0.000).

    # HRP5P_PD_GAINS (mjlab hrp5_constants.py), reprises telles quelles de
    # hrp5p_mj_description/pdgains/PDgains_sim.dat -- gains PD REELS du robot,
    # PAS recopiees de RHPS1 (RHPS1 et HRP5P n'ont ni les memes joints ni les
    # memes actionneurs, cf. commentaire en tete du fichier).
    # kp/kd des 33 joints actionnes = HRP5P_PD_GAINS de l'entrainement
    # hrp5_mirror (identiques aux stiffness/damping de params/env.yaml du run
    # 2026-10-05_11-39-28). Mains/HDY inchanges (hors policy).
    kp: &hrp5p_kp
      RCY:  4500.0
      RCR:  13000.0
      RCP:  8000.0
      RKP:  16000.0
      RAP:  5500.0
      RAR:  4500.0
      LCY:  4500.0
      LCR:  13000.0
      LCP:  8000.0
      LKP:  16000.0
      LAP:  5500.0
      LAR:  4500.0
      WP:   9000.0
      WR:   4800.0
      WY:   3500.0
      HY:   1200.0
      HP:   1200.0
      RSC:  5000.0
      RSP:  8200.0
      RSR:  4000.0
      RSY:  4000.0
      REP:  3000.0
      RWRY: 2500.0
      RWRR: 1600.0
      RWRP: 1600.0
      LSC:  5000.0
      LSP:  8200.0
      LSR:  4000.0
      LSY:  4000.0
      LEP:  3000.0
      LWRY: 2500.0
      LWRR: 1600.0
      LWRP: 1600.0
      # PDgains_sim.dat lignes 26-53 (hors ref_joint_order) : RHDY/LHDY et les
      # 9 articulations de chaque main partagent toutes la meme valeur (693.0).
      RHDY: 693.0
      LHDY: 693.0
      RTMP:  693.0
      RTPIP: 693.0
      RTDIP: 693.0
      RIMP:  693.0
      RIPIP: 693.0
      RIDIP: 693.0
      RMMP:  693.0
      RMPIP: 693.0
      RMDIP: 693.0
      LTMP:  693.0
      LTPIP: 693.0
      LTDIP: 693.0
      LIMP:  693.0
      LIPIP: 693.0
      LIDIP: 693.0
      LMMP:  693.0
      LMPIP: 693.0
      LMDIP: 693.0
    kd: &hrp5p_kd
      RCY:  90.00
      RCR:  130.00
      RCP:  170.00
      RKP:  160.00
      RAP:  82.00
      RAR:  52.00
      LCY:  90.00
      LCR:  130.00
      LCP:  170.00
      LKP:  160.00
      LAP:  82.00
      LAR:  52.00
      WP:   180.00
      WR:   115.00
      WY:   60.00
      HY:   35.00
      HP:   48.00
      RSC:  60.00
      RSP:  100.00
      RSR:  70.00
      RSY:  56.00
      REP:  42.00
      RWRY: 53.00
      RWRR: 25.00
      RWRP: 25.00
      LSC:  60.00
      LSP:  100.00
      LSR:  70.00
      LSY:  56.00
      LEP:  42.00
      LWRY: 53.00
      LWRR: 25.00
      LWRP: 25.00
      RHDY: 6.93
      LHDY: 6.93
      RTMP:  6.93
      RTPIP: 6.93
      RTDIP: 6.93
      RIMP:  6.93
      RIPIP: 6.93
      RIDIP: 6.93
      RMMP:  6.93
      RMPIP: 6.93
      RMDIP: 6.93
      LTMP:  6.93
      LTPIP: 6.93
      LTDIP: 6.93
      LIMP:  6.93
      LIPIP: 6.93
      LIDIP: 6.93
      LMMP:  6.93
      LMPIP: 6.93
      LMDIP: 6.93

    # Ordre ATTENDU PAR LE RESEAU, confirme directement dans les metadonnees
    # de policy/hrp5_collisions.onnx (joint_names, action_scale -- 33 entrees). NE PAS
    # utiliser l'ordre de HRP5P_ACTUATORS dans hrp5_constants.py : ce tuple
    # place LWRY avant LEP pour le bras gauche, incoherent avec l'onnx reel
    # (qui a EP avant WRY des deux cotes, symetrique avec le bras droit).
    ref_joint_order:
      - RCY
      - RCR
      - RCP
      - RKP
      - RAP
      - RAR
      - LCY
      - LCR
      - LCP
      - LKP
      - LAP
      - LAR
      - WP
      - WR
      - WY
      - HY
      - HP
      - RSC
      - RSP
      - RSR
      - RSY
      - REP
      - RWRY
      - RWRR
      - RWRP
      - LSC
      - LSP
      - LSR
      - LSY
      - LEP
      - LWRY
      - LWRR
      - LWRP

  # index 1 : angmom -- memes reglages que push7 (index 0). action_scale et q0
  # viennent de chaque onnx. Pour regler angmom a part, remplacer l'alias par
  # un bloc complet.
  - *hrp5p_push_family
  # index 2 : push11 -- memes reglages que push7 (index 0).
  - *hrp5p_push_family

  # index 3: P8, whole-body motion tracking (mjlab BeyondMimic-style): P6 final
  # fine-tuned 1000 iterations through mjlab's model of this posture chain
  # (PostureTask, kinematic QP with the joint-limit damper, the robot's servos),
  # with the tick drawn from 2 or 5 ms, a 0-10 ms command delay and the servo
  # gains randomized. Checkpoint mjlab_link_tracking hrp5p_tracking
  # 2026-10-22_19-19-11_P8_posture_dr_ft_from_P6/model_17998.pt, task
  # Mjlab-Tracking-Flat-HRP5P-Posture2or5ms-Delay0to10ms-ServoGains-MultiMotion-
  # WristOri-PathCutoff-JointPos-SwingHeight-JointVel-LegJointPos-FootOri-
  # ActionFilter-StanceSlip. Same observation, action and gains as P6 final.
  # In that model at the 5 ms tick it does not fall on the 10, 15 and 31 s clips
  # but still falls on some stretches of long motions: short clips first.
  # MotionTracker (src/MotionTracker.h) runs it: ARM ramps (min-jerk) from the
  # held posture to the selected motion's first frame, settles, then tracks
  # from frame 0; HOLD freezes the posture target at the last command.
  # Observation obs_format 9 (220 = 106 reference joint angles/velocities + 3
  # + 6 anchor + 3 IMU-site linear velocity + 3 gyro + 33 + 33 + 33 raw previous
  # action). Action: q0 + action_scale * action over ref_joint_order, low-pass
  # filtered at action_filter_cutoff_hz once per policy step (mjlab's
  # FilteredJointPositionAction, seeded with the measured joint angles), clamped
  # to the joint range, to the PostureTask (K posture_stiffness, damping 2
  # sqrt(K), no refVel). 20 ms policy step: 10 ticks at 2 ms, 4 at 5 ms.
  - use_QP: true
    obs_format: 9
    velocity_action: false
    # action_scale and q0 below at full precision (the onnx metadata path rounds
    # to 3 decimals; this onnx has no default_joint_pos / action_scale entries).
    use_onnx_metadata: false
    policy_step_size: 0.02
    physics_step_size: 0.001
    pd_gains_ratio: 1.0
    posture_stiffness: 1600
    posture_ref_vel: false
    # The real servo takes the angle only, but damps the change of its tracking
    # error (hrp5p-iob), an implicit velocity reference; mc_mujoco's PD gets the
    # QP's velocity as that reference, the closest to the robot (true would damp
    # the joint velocity instead). No effect on the robot.
    qp_zero_vel_out: false
    # Auto-HOLD above this measured joint speed (rad/s); see
    # NewRLQPController_maxJointVel in the logs.
    runaway_disarm_vel: 6.0
    # Fall guard: auto-HOLD when the torso as the policy observes it (the
    # anchor body, from base_source) leans more than this from vertical (rad;
    # 0 turns it off). Every slot gets 0.5 when the key is absent. See
    # NewRLQPController_torsoTilt and NewRLQPController_disarmReason (3) in the
    # logs, "Last disarm" in the GUI. To confirm on the robot before relying on
    # it.
    fall_disarm_tilt: 0.5
    tracking:
      # Motion selected at load (a CSV of the motions directory, one row per
      # 20 ms frame, by its path in it: one folder per motion set); the GUI
      # selects another one while disarmed. The 10 s stand, so arming without
      # picking a motion never starts a long one.
      motion: clips/motion_stand_seed104_10s.csv
      # Default: the installed share/NewRLQPController/motions. Set it to the
      # source folder (<repo>/motions) to use new CSVs without reinstalling.
      # motions_dir: /path/to/new-rl-qp-controller/motions
      kind: whole_body
      anchor_body: Chest_Link2
      base_body: Body
      imu_sensor: Accelerometer
      imu_site_pos: [-0.09, 0.0, 0.125]
      action_filter_cutoff_hz: 4.0
      observations: [command, motion_anchor_pos_b, motion_anchor_ori_b, base_lin_vel, base_ang_vel, joint_pos,
                     joint_vel, actions]
      # ARM: min-jerk ramp to the first frame at this mean joint speed (rad/s,
      # at least 1 s), then a hold of arm_settle_time (s) before frame 0.
      arm_ramp_speed: 0.1
      arm_settle_time: 2.0
      # Where the observed floating-base state (anchor pose, base velocities)
      # comes from: estimate (the observer pipeline's floating base, MCWaiko, and
      # the IMU gyro) or ground_truth (the simulator's free joint, refused on the
      # robot). Both are logged whatever the source (Tracking_est*, Tracking_gt*).
      base_source: estimate
    # From the P6 package's policy.yaml (export_deploy.py); P8's export has the
    # same values (checked 23 Oct). q0: the 35 actuated
    # joints (RHDY/LHDY are held at 0); kp/kd only feed logs and the QP bypass
    # here, the PostureTask drives the robot.
    action_scale:
